<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚜ Skavtski Arhiv</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --green-dark:#152D0A; --green:#254D14; --green-mid:#386B1F; --green-light:#4F8A2C; --green-pale:#EBF3E4;
  --amber:#7D5C0A; --amber-mid:#A87C12; --amber-light:#D4A820; --amber-pale:#FDF6DC;
  --red:#7A1C00; --red-light:#B52800; --red-pale:#FAEAE4;
  --blue:#1A4A7A; --blue-pale:#E4EEF8;
  --parchment:#F3ECD8; --parchment-dark:#E6D9BF; --parchment-mid:#EDE0C8;
  --cream:#FDFAF3; --brown-dark:#2A1608; --brown-light:#6B4020;
  --text:#25160A; --text-mid:#4A3020; --text-muted:#7A6040;
  --border:#C8B48A; --border-light:#DDD0B0;
  --shadow-sm:0 2px 8px rgba(42,26,10,.10); --shadow:0 4px 20px rgba(42,26,10,.14); --shadow-lg:0 8px 40px rgba(42,26,10,.18);
  --r:6px; --rl:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Lora',Georgia,serif;background:var(--parchment);color:var(--text);min-height:100vh;line-height:1.6}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--parchment-dark)}
::-webkit-scrollbar-thumb{background:var(--green-mid);border-radius:4px}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.anim{animation:fadeUp .28s ease}

/* ── LAYOUT ── */
#app-shell{display:flex;flex-direction:column;min-height:100vh}
#topbar-container{position:sticky;top:0;z-index:200}
#content{flex:1}

/* ── TOPBAR ── */
#topbar{background:var(--green-dark);color:#D8EDCC;display:flex;align-items:center;padding:0 28px;height:54px;gap:14px;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.tb-logo{font-family:'Playfair Display',serif;font-weight:700;font-size:1.1rem;color:#C8DFB8;display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.tb-breadcrumb{display:flex;align-items:center;gap:5px;font-size:.82rem;color:#7AAA68;overflow:hidden}
.tb-breadcrumb .crumb{color:#4A6A3A;flex-shrink:0}
.tb-breadcrumb b{color:#C8DFB8;font-weight:500;font-family:'Lora',serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-spacer{flex:1}
.tb-user{display:flex;align-items:center;gap:8px;font-size:.83rem;color:#A8C898;flex-shrink:0}
.tb-avatar{width:30px;height:30px;border-radius:50%;background:var(--green-mid);border:2px solid #4F8A2C;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:#D8EDCC}
.btn-logout{background:transparent;border:1px solid #3D5A30;color:#8AAA78;padding:4px 12px;border-radius:4px;cursor:pointer;font-size:.78rem;font-family:'Lora',serif;transition:all .18s;flex-shrink:0}
.btn-logout:hover{background:rgba(255,255,255,.07);color:#C8DFB8}

/* ── MAIN WRAPPER ── */
.page-wrap{padding:32px 40px;max-width:1360px;margin:0 auto}
@media(max-width:768px){.page-wrap{padding:18px 14px}}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:var(--r);border:none;cursor:pointer;font-family:'Lora',serif;font-size:.9rem;font-weight:600;transition:all .18s;text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--green);color:#D8EDCC;box-shadow:0 2px 8px rgba(37,77,20,.28)}
.btn-primary:hover{background:var(--green-mid);transform:translateY(-1px);box-shadow:0 4px 14px rgba(37,77,20,.33)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-secondary{background:var(--amber-pale);color:var(--amber);border:1px solid var(--amber-light)}
.btn-secondary:hover{background:#FAF0C0;transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--text-muted);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--parchment-dark);color:var(--text)}
.btn-danger{background:var(--red-pale);color:var(--red-light);border:1px solid #D4846A}
.btn-danger:hover{background:#F5D0C4}
.btn-sm{padding:5px 12px;font-size:.8rem}
.btn-lg{padding:11px 26px;font-size:.97rem}
.btn-icon{padding:6px 8px;font-size:.9rem}

/* ── CARDS ── */
.card{background:var(--cream);border:1px solid var(--border-light);border-radius:var(--rl);box-shadow:var(--shadow-sm)}
.section-heading{margin-bottom:26px}
.section-heading h1{font-family:'Playfair Display',serif;font-size:1.85rem;font-weight:700;color:var(--green-dark);line-height:1.2}
.section-heading p{color:var(--text-muted);font-size:.93rem;margin-top:4px;font-style:italic}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 9px;border-radius:20px;font-size:.73rem;font-weight:600;letter-spacing:.02em}
.bg{background:var(--green-pale);color:var(--green);border:1px solid #B8D4A8}
.ba{background:var(--amber-pale);color:var(--amber);border:1px solid #D8C070}
.br{background:var(--red-pale);color:var(--red-light);border:1px solid #D4946A}
.bb{background:var(--blue-pale);color:var(--blue);border:1px solid #A8C4E0}
.bgr{background:#F0EDE4;color:var(--text-muted);border:1px solid var(--border-light)}

/* ── FORM ── */
.fg{margin-bottom:18px}
.fg label{display:block;font-size:.83rem;font-weight:600;color:var(--text-mid);margin-bottom:5px;letter-spacing:.01em}
.fc{width:100%;padding:9px 13px;border:1px solid var(--border);border-radius:var(--r);background:var(--cream);font-family:'Lora',serif;font-size:.91rem;color:var(--text);transition:border-color .18s,box-shadow .18s}
.fc:focus{outline:none;border-color:var(--green-light);box-shadow:0 0 0 3px rgba(79,138,44,.12)}
textarea.fc{resize:vertical;min-height:110px}

/* ── DIVIDER ── */
hr.div{border:none;border-top:1px solid var(--border-light);margin:22px 0}

/* ── TOAST ── */
#toast{position:fixed;bottom:24px;right:24px;background:var(--green-dark);color:#D8EDCC;padding:11px 18px;border-radius:var(--rl);font-size:.86rem;box-shadow:var(--shadow-lg);z-index:9999;display:none;animation:fadeIn .22s ease;max-width:300px;line-height:1.5}
#toast.show{display:block}
#toast.err{background:var(--red)}
#toast.amb{background:var(--amber);color:#FFF9E0}

/* ── MODAL ── */
.mo{position:fixed;inset:0;background:rgba(21,45,10,.45);z-index:600;display:flex;align-items:center;justify-content:center;animation:fadeIn .18s ease}
.mo-box{background:var(--cream);border-radius:var(--rl);box-shadow:var(--shadow-lg);padding:30px;max-width:500px;width:92%;animation:fadeUp .22s ease}
.mo-box h2{font-family:'Playfair Display',serif;font-size:1.28rem;color:var(--green-dark);margin-bottom:12px}
.mo-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:22px}

/* ── BACK LINK ── */
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-size:.86rem;font-weight:600;cursor:pointer;margin-bottom:18px;background:none;border:none;font-family:'Lora',serif;transition:gap .15s}
.back-link:hover{gap:10px}

/* ────────────────────────────────────────
   LOGIN
──────────────────────────────────────── */
#login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--green-dark);position:relative;overflow:hidden}
#login-page::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 50%,rgba(78,130,40,.25) 0%,transparent 60%),radial-gradient(ellipse at 80% 80%,rgba(168,124,18,.15) 0%,transparent 50%)}
.login-card{background:var(--cream);border-radius:18px;padding:46px 42px;width:100%;max-width:390px;box-shadow:0 20px 60px rgba(0,0,0,.35);position:relative;z-index:1;animation:fadeUp .38s ease}
.login-logo{text-align:center;margin-bottom:30px}
.login-logo .emb{font-size:2.8rem;display:block;margin-bottom:8px}
.login-logo h1{font-family:'Playfair Display',serif;font-size:1.55rem;color:var(--green-dark);font-weight:700}
.login-logo p{color:var(--text-muted);font-size:.83rem;margin-top:4px;font-style:italic}
.login-hint{background:var(--amber-pale);border:1px solid var(--amber-light);border-radius:var(--r);padding:9px 13px;font-size:.78rem;color:var(--amber);margin-bottom:18px;line-height:1.55}
.login-err{color:var(--red-light);font-size:.82rem;margin-bottom:10px;display:none}

/* ────────────────────────────────────────
   DASHBOARD
──────────────────────────────────────── */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-top:6px}
.dash-card{background:var(--cream);border:1px solid var(--border-light);border-radius:var(--rl);padding:30px 26px;cursor:pointer;transition:all .22s;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.dash-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--green);transition:height .2s}
.dash-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.dash-card:hover::before{height:6px}
.dash-card.dc-amb::before{background:var(--amber-mid)}
.dash-card.dc-red::before{background:var(--red-light)}
.dash-card.dc-blue::before{background:var(--blue)}
.dc-icon{font-size:2.3rem;margin-bottom:14px;display:block}
.dash-card h2{font-family:'Playfair Display',serif;font-size:1.25rem;color:var(--green-dark);margin-bottom:7px;font-weight:700}
.dash-card.dc-amb h2{color:var(--amber)}
.dash-card.dc-red h2{color:var(--red)}
.dash-card.dc-blue h2{color:var(--blue)}
.dash-card p{color:var(--text-muted);font-size:.85rem;line-height:1.55;font-style:italic}

/* ────────────────────────────────────────
   ARCHIVE
──────────────────────────────────────── */
.archive-layout{display:grid;grid-template-columns:240px 1fr;gap:22px;align-items:start}
@media(max-width:768px){.archive-layout{grid-template-columns:1fr}}
.arch-sidebar{background:var(--cream);border:1px solid var(--border-light);border-radius:var(--rl);padding:18px;box-shadow:var(--shadow-sm);position:sticky;top:70px}
.sb-section{margin-bottom:20px}
.sb-section h3{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:9px;padding-bottom:5px;border-bottom:1px solid var(--border-light)}
.fi{display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:var(--r);cursor:pointer;font-size:.86rem;color:var(--text-mid);transition:all .13s;margin-bottom:1px;user-select:none}
.fi:hover{background:var(--green-pale);color:var(--green)}
.fi.active{background:var(--green-pale);color:var(--green);font-weight:600}
.fi .fc-count{margin-left:auto;font-size:.7rem;background:var(--parchment-dark);color:var(--text-muted);padding:1px 6px;border-radius:9px}

/* ARCHIVE SEARCH BAR — static wrapper */
.arch-search-bar{display:flex;gap:9px;margin-bottom:18px}
.arch-search-bar input{flex:1;padding:9px 14px;border:1px solid var(--border);border-radius:var(--r);background:var(--cream);font-family:'Lora',serif;font-size:.91rem;color:var(--text);transition:border-color .18s,box-shadow .18s}
.arch-search-bar input:focus{outline:none;border-color:var(--green-light);box-shadow:0 0 0 3px rgba(79,138,44,.12)}

/* TREE VIEW */
.tree-view{display:flex;flex-direction:column;gap:2px}
.tree-folder{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r);cursor:pointer;font-size:.89rem;font-weight:600;color:var(--text-mid);transition:all .14s;user-select:none}
.tree-folder:hover{background:var(--parchment-mid)}
.tree-folder .tf-arrow{font-size:.72rem;color:var(--text-muted);transition:transform .18s;width:12px;text-align:center;flex-shrink:0}
.tree-folder.open .tf-arrow{transform:rotate(90deg)}
.tree-folder .tf-icon{font-size:1rem;flex-shrink:0}
.tree-folder .tf-count{margin-left:auto;font-size:.7rem;background:var(--parchment-dark);color:var(--text-muted);padding:1px 6px;border-radius:9px}
.tree-children{overflow:hidden}
.tree-indent-1{padding-left:18px}
.tree-indent-2{padding-left:36px}
.tree-indent-3{padding-left:54px}
.tree-report{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r);cursor:pointer;font-size:.85rem;color:var(--text-mid);transition:all .14s;margin-bottom:1px}
.tree-report:hover{background:var(--green-pale);color:var(--green)}
.tree-report .tr-icon{font-size:.9rem;flex-shrink:0}
.tree-report .tr-title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree-report .tr-year{font-size:.72rem;color:var(--text-muted);margin-left:auto;flex-shrink:0}

/* FLAT LIST */
.flat-list{display:flex;flex-direction:column;gap:10px}
.report-card{background:var(--cream);border:1px solid var(--border-light);border-radius:var(--rl);padding:16px 20px;cursor:pointer;transition:all .17s;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:16px}
.report-card:hover{box-shadow:var(--shadow);border-color:var(--green-light);transform:translateX(2px)}
.rc-ico{font-size:1.5rem;width:42px;height:42px;background:var(--green-pale);border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rc-info{flex:1;min-width:0}
.rc-title{font-family:'Playfair Display',serif;font-size:.98rem;font-weight:600;color:var(--text);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.76rem;color:var(--text-muted)}
.rc-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}

/* REPORT DETAIL */
.rdh{background:var(--cream);border:1px solid var(--border-light);border-radius:var(--rl);padding:26px 30px;margin-bottom:18px;box-shadow:var(--shadow-sm)}
.rdh h1{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;color:var(--green-dark);margin-bottom:10px}
.rdh-meta{display:flex;flex-wrap:wrap;gap:18px;margin-top:14px}
.rdh-meta-item label{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:2px}
.rdh-meta-item span{font-size:.88rem;font-weight:600;color:var(--text-mid)}
.report-body{background:var(--cream);border:1px solid var(--border-light);border-radius:var(--rl);padding:30px;box-shadow:var(--shadow-sm);line-height:1.82;font-size:.93rem}
.report-body h3{font-family:'Playfair Display',serif;font-size:1.05rem;color:var(--green-dark);margin:18px 0 7px;padding-bottom:3px;border-bottom:1px solid var(--border-light)}
.report-body h3:first-child{margin-top:0}

/* ────────────────────────────────────────
   REPORT SUBMISSION (STEPPER)
──────────────────────────────────────── */
.stepper{display:flex;align-items:center;margin-bottom:32px}
.step{display:flex;align-items:center;flex:1;gap:8px}
.step:last-child{flex:0}
.step-circle{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);background:var(--parchment);display:flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:700;color:var(--text-muted);flex-shrink:0;transition:all .25s}
.step.active .step-circle{border-color:var(--green);background:var(--green);color:white}
.step.done .step-circle{border-color:var(--green-mid);background:var(--green-pale);color:var(--green)}
.step-line{flex:1;height:2px;background:var(--border-light);transition:background .3s}
.step.done .step-line{background:var(--green-mid)}
.step-label{font-size:.76rem;color:var(--text-muted);white-space:nowrap;font-weight:500}
.step.active .step-label{color:var(--green);font-weight:700}
.step.done .step-label{color:var(--text-mid)}

.sub-section{background:var(--cream);border:1px solid var(--border-light);border-radius:var(--rl);padding:24px 28px;box-shadow:var(--shadow-sm);margin-bottom:18px}
.sub-section h3{font-family:'Playfair Display',serif;font-size:1.02rem;font-weight:700;color:var(--green-dark);margin-bottom:14px;padding-bottom:9px;border-bottom:1px solid var(--border-light)}

.type-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:11px;margin-bottom:14px}
.type-card{background:var(--cream);border:2px solid var(--border-light);border-radius:var(--rl);padding:18px 15px;cursor:pointer;transition:all .18s;text-align:center}
.type-card:hover{border-color:var(--green-light);background:var(--green-pale);transform:translateY(-2px)}
.type-card.sel{border-color:var(--green);background:var(--green-pale);box-shadow:0 0 0 3px rgba(37,77,20,.1)}
.tc-icon{font-size:1.7rem;margin-bottom:7px;display:block}
.tc-name{font-size:.87rem;font-weight:600;color:var(--text-mid)}

.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
.chip{padding:6px 15px;border:1px solid var(--border);border-radius:20px;font-size:.83rem;cursor:pointer;background:var(--cream);color:var(--text-mid);transition:all .14s;font-family:'Lora',serif}
.chip:hover{border-color:var(--green);color:var(--green);background:var(--green-pale)}
.chip.sel{background:var(--green);color:white;border-color:var(--green)}

.draft-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding:10px 16px;background:var(--amber-pale);border:1px solid #D4C070;border-radius:var(--r);font-size:.83rem;color:var(--amber)}
.as-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;display:inline-block}

.review-field{margin-bottom:12px;padding:11px 14px;background:var(--parchment);border-radius:var(--r);border:1px solid var(--border-light)}
.review-field label{display:block;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);margin-bottom:3px}
.review-field .rv{font-size:.88rem;color:var(--text-mid)}

.confirm-banner{background:var(--green-pale);border:1px solid var(--green-mid);border-radius:var(--rl);padding:32px;text-align:center}
.confirm-banner .cb-ico{font-size:2.8rem;margin-bottom:10px;display:block}
.confirm-banner h3{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--green-dark);margin-bottom:6px}
.confirm-banner p{font-size:.86rem;color:var(--text-muted);font-style:italic}

/* ────────────────────────────────────────
   TEMPLATE MANAGER
──────────────────────────────────────── */
.tmpl-section{margin-bottom:28px}
.tmpl-section-hdr{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px;padding-bottom:5px;border-bottom:1px solid var(--border-light);display:block}
.tmpl-card{background:var(--cream);border:1px solid var(--border-light);border-radius:var(--rl);padding:16px 20px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow-sm);transition:box-shadow .18s;margin-bottom:10px}
.tmpl-card:hover{box-shadow:var(--shadow)}
.tmpl-ico{font-size:1.7rem;width:44px;height:44px;background:var(--parchment);border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tmpl-info{flex:1;min-width:0}
.tmpl-info h3{font-family:'Playfair Display',serif;font-size:.97rem;font-weight:600;color:var(--text);margin-bottom:3px}
.tmpl-info p{font-size:.78rem;color:var(--text-muted);font-style:italic}
.tmpl-actions{display:flex;gap:7px;flex-shrink:0}
.field-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.field-item{display:flex;align-items:center;gap:10px;padding:9px 13px;background:var(--parchment);border:1px solid var(--border-light);border-radius:var(--r);font-size:.86rem}
.fi-drag{color:var(--border);font-size:.95rem}
.fi-name{flex:1;font-weight:600;color:var(--text-mid)}
.fi-type{font-size:.72rem;background:var(--border-light);padding:2px 8px;border-radius:9px;color:var(--text-muted)}
.icon-picker{display:flex;gap:7px;flex-wrap:wrap}
.ip-opt{width:42px;height:42px;border:2px solid var(--border-light);background:var(--parchment);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;cursor:pointer;transition:all .15s}
.ip-opt:hover{border-color:var(--green)}
.ip-opt.sel{border-color:var(--green);background:var(--green-pale)}
.create-specific{background:var(--blue-pale);border:1px solid #A8C4E0;border-radius:var(--rl);padding:18px 20px;display:flex;align-items:center;gap:14px;margin-top:16px}

/* ────────────────────────────────────────
   GROUP PAGE
──────────────────────────────────────── */
.group-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:13px;margin-bottom:26px}
.stat-card{background:var(--cream);border:1px solid var(--border-light);border-radius:var(--rl);padding:16px 18px;box-shadow:var(--shadow-sm);text-align:center}
.sc-num{font-family:'Playfair Display',serif;font-size:1.9rem;font-weight:700;color:var(--green-dark);line-height:1.1}
.sc-lbl{font-size:.76rem;color:var(--text-muted);font-style:italic;margin-top:3px}

.tabs{display:flex;gap:0;border-bottom:2px solid var(--border-light);margin-bottom:24px}
.tab{padding:9px 20px;font-size:.85rem;font-weight:600;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;font-family:'Lora',serif;white-space:nowrap}
.tab:hover{color:var(--green)}
.tab.active{color:var(--green);border-bottom-color:var(--green)}

/* ATTENDANCE MATRIX */
.matrix-wrap{overflow-x:auto;border:1px solid var(--border-light);border-radius:var(--rl);background:var(--cream);box-shadow:var(--shadow-sm)}
.matrix-table{border-collapse:collapse;min-width:100%;font-size:.82rem}
.matrix-table th{padding:9px 10px;background:var(--green-dark);color:#C8DFB8;font-weight:600;font-size:.76rem;text-align:center;white-space:nowrap;position:sticky;top:0;z-index:2}
.matrix-table th.col-member{text-align:left;min-width:150px;position:sticky;left:0;z-index:3;background:var(--green-dark)}
.matrix-table td{padding:7px 8px;border-bottom:1px solid var(--border-light);text-align:center;white-space:nowrap;transition:background .12s}
.matrix-table td.col-member{text-align:left;position:sticky;left:0;background:var(--cream);z-index:1;border-right:1px solid var(--border-light);font-weight:600;font-size:.84rem;padding:7px 12px}
.matrix-table tr:nth-child(even) td.col-member{background:#FAF7EF}
.matrix-table tr:hover td{background:var(--green-pale)!important}
.att-cell{width:34px;height:32px;cursor:pointer;border-radius:4px;display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:.85rem;transition:all .13s;border:1px solid transparent}
.att-cell.present{background:var(--green-pale);border-color:var(--green-mid);color:var(--green)}
.att-cell.absent{background:var(--red-pale);border-color:#D48080;color:var(--red-light)}
.att-cell.unknown{background:var(--parchment);border-color:var(--border-light);color:var(--border)}
.att-cell:hover{transform:scale(1.15)}
.att-pct{font-size:.76rem;color:var(--text-muted);text-align:right;padding:5px 12px;background:var(--parchment);border-top:1px solid var(--border-light);border-radius:0 0 var(--rl) var(--rl)}

/* SKILLS */
.skill-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
.skill-card{background:var(--cream);border:1px solid var(--border-light);border-radius:var(--rl);padding:18px 16px;cursor:pointer;transition:all .18s;box-shadow:var(--shadow-sm);text-align:center}
.skill-card:hover{box-shadow:var(--shadow);transform:translateY(-2px);border-color:var(--green-light)}
.skill-card .sk-icon{font-size:2rem;margin-bottom:8px;display:block}
.skill-card .sk-name{font-family:'Playfair Display',serif;font-size:.95rem;font-weight:600;color:var(--text);margin-bottom:6px}
.skill-card .sk-prog{font-size:.75rem;color:var(--text-muted);margin-bottom:8px}
.skill-pbar{height:4px;background:var(--parchment-dark);border-radius:2px;overflow:hidden;margin-top:4px}
.skill-pbar-fill{height:100%;background:var(--green);border-radius:2px;transition:width .4s}

.req-table-wrap{overflow-x:auto;border:1px solid var(--border-light);border-radius:var(--rl);background:var(--cream);box-shadow:var(--shadow-sm)}
.req-table{border-collapse:collapse;min-width:100%;font-size:.82rem}
.req-table th{padding:9px 10px;background:var(--green-dark);color:#C8DFB8;font-weight:600;font-size:.74rem;white-space:nowrap;text-align:center;position:sticky;top:0;z-index:2}
.req-table th.col-member{text-align:left;min-width:150px;position:sticky;left:0;z-index:3;background:var(--green-dark)}
.req-table td{padding:7px 8px;border-bottom:1px solid var(--border-light);text-align:center;transition:background .12s}
.req-table td.col-member{text-align:left;position:sticky;left:0;background:var(--cream);z-index:1;border-right:1px solid var(--border-light);font-weight:600;font-size:.84rem;padding:7px 12px;white-space:nowrap}
.req-table tr:nth-child(even) td.col-member{background:#FAF7EF}
.req-table tr:hover td{background:var(--green-pale)!important}
.req-cell{width:32px;height:30px;cursor:pointer;border-radius:4px;display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:.82rem;transition:all .13s;border:1px solid transparent}
.req-cell.done{background:var(--green-pale);border-color:var(--green-mid);color:var(--green)}
.req-cell.todo{background:var(--parchment);border-color:var(--border-light);color:var(--border)}
.req-cell:hover{transform:scale(1.15)}
.earned-cell{font-size:.8rem;font-weight:700;padding:4px 8px;border-radius:10px;white-space:nowrap}
.earned-cell.yes{background:var(--green-pale);color:var(--green)}
.earned-cell.no{background:var(--parchment);color:var(--text-muted)}

/* LOG ENTRIES */
.log-list{display:flex;flex-direction:column;gap:9px}
.log-item{display:flex;align-items:flex-start;gap:11px;padding:11px 15px;border-radius:var(--r)}
.log-item.praise{background:var(--green-pale);border-left:3px solid var(--green)}
.log-item.scold{background:var(--red-pale);border-left:3px solid var(--red-light)}
.li-who{font-size:.75rem;font-weight:700;color:var(--text-mid);margin-bottom:2px}
.li-text{font-size:.85rem;color:var(--text-mid);flex:1}
.li-date{font-size:.73rem;color:var(--text-muted);font-style:italic;flex-shrink:0}

/* MEMBER MANAGEMENT */
.member-mgmt-list{display:flex;flex-direction:column;gap:10px}
.mbr-row{background:var(--cream);border:1px solid var(--border-light);border-radius:var(--rl);padding:14px 18px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow-sm);transition:box-shadow .18s}
.mbr-row:hover{box-shadow:var(--shadow)}
.mbr-row.bday{border-color:var(--amber-light);background:var(--amber-pale)}
.mbr-avatar{width:40px;height:40px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:1rem;color:white;font-weight:700;flex-shrink:0}
.mbr-row.bday .mbr-avatar{background:var(--amber-mid)}
.mbr-name{font-family:'Playfair Display',serif;font-size:.97rem;font-weight:600;color:var(--text)}
.mbr-sub{font-size:.76rem;color:var(--text-muted);font-style:italic}
.mbr-actions{margin-left:auto;display:flex;gap:7px}

/* INLINE HEADER */
.inh{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:10px;flex-wrap:wrap}
.inh h2{font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:700;color:var(--green-dark)}

/* EMPTY STATE */
.empty{text-align:center;padding:44px 20px;color:var(--text-muted)}
.empty .ei{font-size:2.6rem;margin-bottom:10px;display:block}
.empty p{font-style:italic;font-size:.88rem}

/* SECTION LABEL */
.slbl{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-bottom:14px;display:block}

/* PBAR */
.pbar-wrap{height:4px;background:var(--parchment-dark);border-radius:2px;overflow:hidden;margin-top:8px}
.pbar-fill{height:100%;border-radius:2px;transition:width .4s}

/* FILTER ROW */
.filter-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.fr-btn{padding:4px 13px;border-radius:14px;border:1px solid var(--border);background:var(--cream);font-family:'Lora',serif;font-size:.79rem;cursor:pointer;color:var(--text-muted);transition:all .13s}
.fr-btn:hover,.fr-btn.active{background:var(--green);color:white;border-color:var(--green)}
.fr-btn.amb{background:var(--amber-pale);color:var(--amber);border-color:var(--amber-light)}
.fr-btn.amb.active{background:var(--amber-mid);color:white;border-color:var(--amber-mid)}
</style>

<script>
// ═══════════════════════════════════════════════

const S = {

// ═══════════════════════════════════════════════

const USERS = [

];

const ACTIVITY_SUBTYPES = ['Začetni zbor','Rodov dan','Čajanka','Zimovanje','Dan tabornikov','Zaključek','Taborjenje'];
const FUNCTION_ROLES = ['Starešina','Načelnik','RR Načelnik','PP Načelnik','GG Načelnik','MČ Načelnik','PR'];

  { id:'letno',    name:'Letno poročilo', icon:'📋' },
  { id:'nacrt',    name:'Načrt dela',     icon:'📅' },
  { id:'financno', name:'Finančno poročilo', icon:'💰' },

// Templates — general (locked) + role-specific (editable)
const BASE_FIELDS = {
  dejavnost: [
    {id:'f1',name:'Naziv dejavnosti',type:'Besedilo'},
    {id:'f2',name:'Datum in kraj',type:'Besedilo'},
    {id:'f3',name:'Število udeležencev',type:'Število'},
    {id:'f4',name:'Opis dejavnosti',type:'Dolgo besedilo'},
    {id:'f5',name:'Dosežki in opažanja',type:'Dolgo besedilo'},
    {id:'f6',name:'Predlogi za prihodnost',type:'Dolgo besedilo'},
  ],
  letno: [
    {id:'f1',name:'Funkcija in vod',type:'Besedilo'},
    {id:'f2',name:'Šolsko leto',type:'Besedilo'},
    {id:'f3',name:'Pregled dela in dosežki',type:'Dolgo besedilo'},
    {id:'f4',name:'Izzivi in rešitve',type:'Dolgo besedilo'},
    {id:'f5',name:'Načrti za naprej',type:'Dolgo besedilo'},
  ],
  nacrt: [
    {id:'f1',name:'Funkcija in vod',type:'Besedilo'},
    {id:'f2',name:'Šolsko leto',type:'Besedilo'},
    {id:'f3',name:'Cilji voda',type:'Dolgo besedilo'},
    {id:'f4',name:'Načrtovane dejavnosti',type:'Dolgo besedilo'},
    {id:'f5',name:'Finančni okvir',type:'Dolgo besedilo'},
    {id:'f6',name:'Odgovornosti',type:'Dolgo besedilo'},
  ],
  financno: [
    {id:'f1',name:'Funkcija in vod',type:'Besedilo'},
    {id:'f2',name:'Obdobje',type:'Besedilo'},
    {id:'f3',name:'Skupni prihodki (€)',type:'Število'},
    {id:'f4',name:'Skupni odhodki (€)',type:'Število'},
    {id:'f5',name:'Razlaga prihodkov',type:'Dolgo besedilo'},
    {id:'f6',name:'Razlaga odhodkov',type:'Dolgo besedilo'},
    {id:'f7',name:'Zaključek',type:'Dolgo besedilo'},

  vod: [
    {id:'f1',name:'Naziv voda',type:'Besedilo'},
    {id:'f2',name:'Vodnik voda',type:'Besedilo'},
    {id:'f3',name:'Število članov',type:'Število'},
    {id:'f4',name:'Napredovanja in dosežki',type:'Dolgo besedilo'},
    {id:'f5',name:'Izzivi',type:'Dolgo besedilo'},
    {id:'f6',name:'Priporočila',type:'Dolgo besedilo'},
  ],
};

// General templates (cannot delete)
const GENERAL_TEMPLATES = [
  { id:'g-dejavnost', name:'Poročilo o dejavnosti', cat:'dejavnost', funcType:null, role:null, icon:'🏕️', general:true, fields: BASE_FIELDS.dejavnost.map(f=>({...f})) },
  { id:'g-letno',     name:'Splošno letno poročilo', cat:'funkcija', funcType:'letno',    role:null, icon:'📋', general:true, fields: BASE_FIELDS.letno.map(f=>({...f})) },
  { id:'g-nacrt',     name:'Splošni načrt dela',     cat:'funkcija', funcType:'nacrt',    role:null, icon:'📅', general:true, fields: BASE_FIELDS.nacrt.map(f=>({...f})) },
  { id:'g-financno',  name:'Splošno finančno poročilo', cat:'funkcija', funcType:'financno', role:null, icon:'💰', general:true, fields: BASE_FIELDS.financno.map(f=>({...f})) },
  { id:'g-vod',       name:'Poročilo voda',          cat:'vod',      funcType:null, role:null, icon:'👥', general:true, fields: BASE_FIELDS.vod.map(f=>({...f})) },
];

// Role-specific templates (user-created overrides)
const ROLE_TEMPLATES = [
  { id:'r-staresina-letno', name:'Letno poročilo starešine', cat:'funkcija', funcType:'letno', role:'Starešina', icon:'📋', general:false,
    fields:[
      {id:'f1',name:'Vod in rodovina',type:'Besedilo'},
      {id:'f2',name:'Šolsko leto',type:'Besedilo'},
      {id:'f3',name:'Pregled vodenja rodu',type:'Dolgo besedilo'},
      {id:'f4',name:'Dejavnosti in udeležba',type:'Dolgo besedilo'},
      {id:'f5',name:'Dosežki in priznanja',type:'Dolgo besedilo'},
      {id:'f6',name:'Izzivi in priporočila',type:'Dolgo besedilo'},
    ]},
  { id:'r-staresina-nacrt', name:'Načrt dela starešine', cat:'funkcija', funcType:'nacrt', role:'Starešina', icon:'📅', general:false,
    fields:[
      {id:'f1',name:'Vod in rodovina',type:'Besedilo'},
      {id:'f2',name:'Šolsko leto',type:'Besedilo'},
      {id:'f3',name:'Strateški cilji',type:'Dolgo besedilo'},
      {id:'f4',name:'Načrtovane dejavnosti',type:'Dolgo besedilo'},
      {id:'f5',name:'Upravljanje vodnikov',type:'Dolgo besedilo'},
      {id:'f6',name:'Proračun in viri',type:'Dolgo besedilo'},
    ]},
  { id:'r-nacelnik-letno', name:'Letno poročilo načelnika', cat:'funkcija', funcType:'letno', role:'Načelnik', icon:'📋', general:false,

      {id:'f2',name:'Šolsko leto',type:'Besedilo'},

      {id:'f6',name:'Predlogi za spremembe programa',type:'Dolgo besedilo'},
    ]},
];
// Mutable array — user additions go here
let allRoleTemplates = ROLE_TEMPLATES.map(t=>JSON.parse(JSON.stringify(t)));

function resolveTmpl(cat, role, funcType) {
  if (cat === 'dejavnost') return GENERAL_TEMPLATES.find(t=>t.id==='g-dejavnost');
  if (cat === 'vod')       return GENERAL_TEMPLATES.find(t=>t.id==='g-vod');
  // funkcija: role-specific first, then general
  const sp = allRoleTemplates.find(t=>t.role===role && t.funcType===funcType);
  if (sp) return sp;
  return GENERAL_TEMPLATES.find(t=>t.funcType===funcType);
}

// Archive reports
const REPORTS = [
  { id:1,  title:'Poletno taborjenje 2023',        cat:'dejavnost', subtype:'Taborjenje',   role:null, funcType:null, author:'Petra Novak', date:'2023-08-20', year:2023,
    body:`<h3>Splošne informacije</h3><p>Taborjenje je potekalo od 10. do 20. avgusta 2023 na Bovškem. Udeležilo se je 18 tabornikov in 4 vodniki.</p><h3>Aktivnosti</h3><p>Med taborjenjem smo izvajali orientacijo, plezanje, rafting in večerne igre ob ognju. Vsak dan smo imeli jutranjo zbornico in večerno refleksijo.</p><h3>Zaključek</h3><p>Taborjenje je uspelo odlično. Mladi so razvili samozavest, timsko delo in spoštovanje narave. Priporočamo enak format z delavnico prve pomoči.` },
  { id:2,  title:'Začetni zbor 2023/24',            cat:'dejavnost', subtype:'Začetni zbor', role:null, funcType:null, author:'Jan Kovač',   date:'2023-09-12', year:2023,
    body:`<h3>Potek zbora</h3><p>Začetni zbor za šolsko leto 2023/24 je potekal 12. septembra 2023. Zbora se je udeležilo 22 članov in 5 vodnikov.</p><h3>Program</h3><p>Pregledan je bil letni program, razdeljene so bile vloge, predstavljeni novi člani.</p>` },
  { id:3,  title:'Zimovanje 2024',                  cat:'dejavnost', subtype:'Zimovanje',    role:null, funcType:null, author:'Petra Novak', date:'2024-01-28', year:2024,
    body:`<h3>Opis aktivnosti</h3><p>Zimovanje je potekalo od 25. do 28. januarja 2024 v planinskem domu na Pohorju. Skupaj 16 tabornikov in 3 vodniki.</p><h3>Program</h3><p>Smučanje, pohod z loparji, nočni orientacijski pohod in taborniške igre v snegu.</p>` },
  { id:4,  title:'Rodov dan 2024',                  cat:'dejavnost', subtype:'Rodov dan',    role:null, funcType:null, author:'Petra Novak', date:'2024-05-18', year:2024,
    body:`<h3>Organizacija</h3><p>Rodov dan 2024 je potekal 18. maja na taborniškem domu. Udeležilo se je 65 tabornikov, vodnikov in staršev.</p><h3>Program</h3><p>Podelitev značk, nastopi, igre in skupna malica. Slavnostni govor je imel župan.</p>` },
  { id:5,  title:'Čajanka 2024',                    cat:'dejavnost', subtype:'Čajanka',      role:null, funcType:null, author:'Jan Kovač',   date:'2024-02-15', year:2024,
    body:`<h3>Namen</h3><p>Čajanka kot zimska prireditev za krepitev skupinskega duha. Okrog ognja, petje pesmi, pripovedovanje zgodb. Udeležba: 24 tabornikov.</p>` },
  { id:6,  title:'Dan tabornikov 2023',             cat:'dejavnost', subtype:'Dan tabornikov', role:null, funcType:null, author:'Jan Kovač', date:'2023-02-22', year:2023,
    body:`<h3>Program dneva</h3><p>Dan tabornikov 2023 je bil posvečen ekologiji in skrbi za naravo. Organizirali smo čistilno akcijo v gozdu in predavanje o biodiverziteti.</p>` },
  { id:7,  title:'Zaključni zbor 2023/24',          cat:'dejavnost', subtype:'Zaključek',    role:null, funcType:null, author:'Petra Novak', date:'2024-06-20', year:2024,
    body:`<h3>Program</h3><p>Zaključni zbor šolskega leta 2023/24 je potekal 20. junija. Podelili smo 12 značk in pohvalili posebej zaslužne člane.</p>` },
  { id:8,  title:'Letno poročilo starešine 2022/23', cat:'funkcija', subtype:null, role:'Starešina', funcType:'letno', author:'Petra Novak', date:'2023-07-01', year:2023,
    body:`<h3>Pregled leta</h3><p>Šolsko leto 2022/23 je bilo izjemno uspešno. Organizirali smo 8 večjih dejavnosti, povečali smo število članov za 15%.</p><h3>Dosežki</h3><p>Rodni dan smo izvedli z rekordno udeležbo. Uspešno smo zaključili projekt obnove taborniškega doma.</p>` },
  { id:9,  title:'Načrt dela starešine 2023/24',     cat:'funkcija', subtype:null, role:'Starešina', funcType:'nacrt', author:'Petra Novak', date:'2023-09-05', year:2023,
    body:`<h3>Cilji leta</h3><p>V šolskem letu 2023/24 si postavljamo: organizacija 10 aktivnosti, pridobitev 5 novih članov, zaključek renovacije shrambe za opremo.</p>` },
  { id:10, title:'Finančno poročilo starešine 2022/23', cat:'funkcija', subtype:null, role:'Starešina', funcType:'financno', author:'Petra Novak', date:'2023-07-15', year:2023,
    body:`<h3>Prihodki</h3><p>Skupni prihodki: 3.840 €. Vir: članarina (1.200 €), prispevki (1.640 €), občina (1.000 €).</p><h3>Odhodki</h3><p>Skupni odhodki: 3.690 €. Presežek: 150 €.</p>` },
  { id:11, title:'Letno poročilo načelnika 2023/24', cat:'funkcija', subtype:null, role:'Načelnik', funcType:'letno', author:'Jan Kovač', date:'2024-06-30', year:2024,
    body:`<h3>Uvod</h3><p>Poročilo zajema vse aktivnosti v šolskem letu 2023/24. Skupno smo organizirali 12 aktivnosti z 340 udeleženci.</p>` },

// ═══════════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════════
function toast(msg, type='') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (type ? ' '+type : '');
  clearTimeout(window._tt);
  window._tt = setTimeout(() => el.className='', 3200);
}
function initials(name) { return name.split(' ').map(p=>p[0]).join('').toUpperCase().slice(0,2); }
function fmtDate(d) { if(!d) return ''; const dd=new Date(d); return dd.toLocaleDateString('sl-SI',{day:'numeric',month:'long',year:'numeric'}); }
function fmtDateShort(d) { if(!d) return ''; const dd=new Date(d); return dd.toLocaleDateString('sl-SI',{day:'numeric',month:'short'}); }
function isBdaySoon(bday) {
  const today=new Date(), bd=new Date(bday);
  const next=new Date(today.getFullYear(), bd.getMonth(), bd.getDate());
  if(next<today) next.setFullYear(today.getFullYear()+1);
  return (next-today)/(1000*60*60*24) <= 14;
}
function getAge(bday) {
  const t=new Date(), b=new Date(bday);
  let a=t.getFullYear()-b.getFullYear();
  if(t < new Date(t.getFullYear(),b.getMonth(),b.getDate())) a--;
  return a;
}
function attPct(m) {
  const vals = MEETINGS.map(mt=>m.att[mt.id]).filter(v=>v!==null&&v!==undefined);
  const pres = vals.filter(v=>v===true);
  return vals.length ? Math.round(pres.length/vals.length*100) : 0;
}
function skillEarned(m, skillId) {
  const skill=SKILLS.find(s=>s.id===skillId); if(!skill) return false;
  const prog=m.skills[skillId]||{};
  return skill.reqs.every(r=>prog[r.id]===true);
}
function skillPct(m, skillId) {
  const skill=SKILLS.find(s=>s.id===skillId); if(!skill) return 0;
  const prog=m.skills[skillId]||{};
  const done=skill.reqs.filter(r=>prog[r.id]===true).length;
  return Math.round(done/skill.reqs.length*100);
}
function catLabel(cat) { return {dejavnost:'Dejavnost',funkcija:'Funkcija',vod:'Poročilo voda'}[cat]||cat; }
function catIcon(cat) { return {dejavnost:'🏕️',funkcija:'📋',vod:'👥'}[cat]||'📄'; }

// RENDER ENGINE — partial updates

function navigate(page, extra={}) {
  Object.assign(S, extra);
  S.page = page;
  renderPage();
  window.scrollTo(0,0);
}

function setHTML(id, html) {
  const el = document.getElementById(id);
  if (el) el.innerHTML = html;
}

function renderPage() {
  const tc = document.getElementById('topbar-container');
  const ct = document.getElementById('content');
  if (S.page === 'login') {
    tc.innerHTML = '';
    ct.innerHTML = buildLogin();
    return;
  }
  tc.innerHTML = buildTopbar();
  switch(S.page) {
    case 'dashboard':  ct.innerHTML = `<div class="page-wrap anim">${buildDashboard()}</div>`; break;
    case 'archive':    ct.innerHTML = `<div class="page-wrap anim">${buildArchivePage()}</div>`; break;
    case 'arch-view':  ct.innerHTML = `<div class="page-wrap anim">${buildReportDetail()}</div>`; break;
    case 'report-new': ct.innerHTML = `<div class="page-wrap anim">${buildReportNew()}</div>`; break;
    case 'templates':  ct.innerHTML = `<div class="page-wrap anim">${buildTemplates()}</div>`; break;
    case 'tmpl-edit':  ct.innerHTML = `<div class="page-wrap anim">${buildTmplEditor()}</div>`; break;
    case 'group':      ct.innerHTML = `<div class="page-wrap anim">${buildGroupPage()}</div>`; break;
    default: ct.innerHTML = buildLogin();
  }
}

}

function buildArchSidebar() {
  const f = S.archFilter;
  const years = [...new Set(REPORTS.map(r=>r.year))].sort((a,b)=>b-a);
  const cats = ['dejavnost','funkcija','vod'];
  return `
  <div class="sb-section">
    <h3>Vrsta poročila</h3>
    <div class="fi${!f.type?' active':''}" onclick="archSetFilter('type',null)">
      📄 Vsa poročila <span class="fc-count">${REPORTS.length}</span>
    </div>
    ${cats.map(c=>{
      const cnt = REPORTS.filter(r=>r.cat===c).length;
      return `<div class="fi${f.type===c?' active':''}" onclick="archSetFilter('type','${c}')">
        ${catIcon(c)} ${catLabel(c)} <span class="fc-count">${cnt}</span>
      </div>`;
    }).join('')}
  </div>
  <div class="sb-section">
    <h3>Leto</h3>
    ${years.map(y=>`
    <div class="fi${f.year===y?' active':''}" onclick="archSetFilter('year',${y})">
      ${y} <span class="fc-count">${REPORTS.filter(r=>r.year===y).length}</span>
    </div>`).join('')}
    ${f.year?`<div class="fi" onclick="archSetFilter('year',null)">✕ Ponastavi leto</div>`:''}
  </div>
  ${f.type||f.year||S.archFilter.query?`
  <button class="btn btn-ghost btn-sm" style="width:100%;justify-content:center" onclick="archClearFilters()">
    ✕ Ponastavi vse
  </button>`:''}`;
}

}

function archClearFilters() {
  S.archFilter = { type:null, year:null, query:'' };

  if (inp) inp.value = '';

  const sb = document.getElementById('arch-sidebar-inner');

}

function buildArchResults() {
  const f = S.archFilter;

function filteredReports() {
  const f = S.archFilter;
  let reps = [...REPORTS];
  if (f.type) reps = reps.filter(r=>r.cat===f.type);
  if (f.year) reps = reps.filter(r=>r.year===f.year);
  if (f.query) {
    const q = f.query.toLowerCase();
    reps = reps.filter(r=>r.title.toLowerCase().includes(q)||r.author.toLowerCase().includes(q)||(r.subtype||'').toLowerCase().includes(q)||(r.role||'').toLowerCase().includes(q));
  }
  return reps;
}

function buildArchFlat() {
  const reps = filteredReports();
  if (!reps.length) return `<div class="empty"><span class="ei">🗂️</span><p>Ni poročil, ki ustrezajo filtrom.</p></div>`;
  return `
  <div style="font-size:.81rem;color:var(--text-muted);margin-bottom:12px">
    Najdeno: <b>${reps.length}</b> ${reps.length===1?'poročilo':'poročil'}
  </div>
  <div class="flat-list">
    ${reps.map(r=>`
    <div class="report-card" onclick="navigate('arch-view',{viewReport:${r.id}})">
      <div class="rc-ico">${catIcon(r.cat)}</div>
      <div class="rc-info">
        <div class="rc-title">${r.title}</div>
        <div class="rc-meta">
          <span class="badge bgr">${catLabel(r.cat)}</span>
          ${r.subtype?`<span class="badge ba">${r.subtype}</span>`:''}
          ${r.role?`<span class="badge bb">${r.role}</span>`:''}
          ${r.funcType?`<span class="badge bb">${FUNC_TYPES.find(ft=>ft.id===r.funcType)?.name||r.funcType}</span>`:''}
          <span>· ✍️ ${r.author}</span>
        </div>
      </div>
      <div class="rc-right"><span class="badge bg">✓ Oddano</span><span style="font-size:.72rem;color:var(--text-muted)">${r.year}</span></div>
    </div>`).join('')}
  </div>`;
}

function buildArchTree() {
  const years = [...new Set(REPORTS.map(r=>r.year))].sort((a,b)=>b-a);
  const op = S.archOpenFolders;
  let html = '<div class="tree-view">';
  for (const year of years) {
    const yId = `y${year}`;
    const yReps = REPORTS.filter(r=>r.year===year);
    const yOpen = op.has(yId);
    html += `
    <div class="tree-folder${yOpen?' open':''}" onclick="archToggleFolder('${yId}')">
      <span class="tf-arrow">▶</span>
      <span class="tf-icon">📁</span>
      <span>${year}</span>
      <span class="tf-count">${yReps.length}</span>
    </div>`;
    if (yOpen) {
      html += `<div class="tree-children">`;
      // Dejavnosti
      const dReps = yReps.filter(r=>r.cat==='dejavnost');
      if (dReps.length) {
        const dId = `${yId}-dejavnost`;
        const dOpen = op.has(dId);
        html += `
        <div class="tree-indent-1">
          <div class="tree-folder${dOpen?' open':''}" onclick="archToggleFolder('${dId}')">
            <span class="tf-arrow">▶</span>
            <span class="tf-icon">🏕️</span>
            <span>Dejavnosti</span>
            <span class="tf-count">${dReps.length}</span>
          </div>`;
        if (dOpen) {
          // group by subtype
          const subtypes = [...new Set(dReps.map(r=>r.subtype||'Ostalo'))];
          for (const st of subtypes) {
            const stReps = dReps.filter(r=>(r.subtype||'Ostalo')===st);
            const stId = `${dId}-${st}`;
            const stOpen = op.has(stId);
            if (stReps.length === 1) {
              // show directly
              const r = stReps[0];
              html += `<div class="tree-indent-2">
                <div class="tree-report" onclick="navigate('arch-view',{viewReport:${r.id}})">
                  <span class="tr-icon">📄</span>
                  <span class="tr-title">${r.title}</span>
                  <span class="tr-year">${fmtDateShort(r.date)}</span>
                </div></div>`;
            } else {
              html += `
              <div class="tree-indent-2">
                <div class="tree-folder${stOpen?' open':''}" onclick="archToggleFolder('${stId}')">
                  <span class="tf-arrow">▶</span><span class="tf-icon">📂</span>
                  <span>${st}</span><span class="tf-count">${stReps.length}</span>
                </div>`;
              if (stOpen) {
                html += `<div class="tree-children">`;
                for (const r of stReps) {
                  html += `<div class="tree-indent-3">
                    <div class="tree-report" onclick="navigate('arch-view',{viewReport:${r.id}})">
                      <span class="tr-icon">📄</span>
                      <span class="tr-title">${r.title}</span>
                      <span class="tr-year">${fmtDateShort(r.date)}</span>
                    </div></div>`;
                }
                html += `</div>`;
              }
              html += `</div>`;
            }
          }
        }
        html += `</div>`;
      }
      // Funkcija
      const fReps = yReps.filter(r=>r.cat==='funkcija');
      if (fReps.length) {
        const fId = `${yId}-funkcija`;
        const fOpen = op.has(fId);
        html += `
        <div class="tree-indent-1">
          <div class="tree-folder${fOpen?' open':''}" onclick="archToggleFolder('${fId}')">
            <span class="tf-arrow">▶</span>
            <span class="tf-icon">📋</span>
            <span>Funkcija</span>
            <span class="tf-count">${fReps.length}</span>
          </div>`;
        if (fOpen) {
          const roles = [...new Set(fReps.map(r=>r.role||'Splošno'))];
          for (const role of roles) {
            const roleReps = fReps.filter(r=>(r.role||'Splošno')===role);
            const roleId = `${fId}-${role}`;
            const roleOpen = op.has(roleId);
            html += `
            <div class="tree-indent-2">
              <div class="tree-folder${roleOpen?' open':''}" onclick="archToggleFolder('${roleId}')">
                <span class="tf-arrow">▶</span><span class="tf-icon">👤</span>
                <span>${role}</span><span class="tf-count">${roleReps.length}</span>
              </div>`;
            if (roleOpen) {
              html += `<div class="tree-children">`;
              for (const r of roleReps) {
                const ftName = FUNC_TYPES.find(ft=>ft.id===r.funcType)?.name||r.funcType||'';
                html += `<div class="tree-indent-3">
                  <div class="tree-report" onclick="navigate('arch-view',{viewReport:${r.id}})">
                    <span class="tr-icon">${FUNC_TYPES.find(ft=>ft.id===r.funcType)?.icon||'📄'}</span>
                    <span class="tr-title">${r.title}</span>
                    <span class="tr-year">${fmtDateShort(r.date)}</span>
                  </div></div>`;
              }
              html += `</div>`;
            }
            html += `</div>`;
          }
        }
        html += `</div>`;
      }
      // Poročilo voda
      const vReps = yReps.filter(r=>r.cat==='vod');
      if (vReps.length) {
        const vId = `${yId}-vod`;
        const vOpen = op.has(vId);
        html += `
        <div class="tree-indent-1">
          <div class="tree-folder${vOpen?' open':''}" onclick="archToggleFolder('${vId}')">
            <span class="tf-arrow">▶</span>
            <span class="tf-icon">👥</span>
            <span>Poročilo voda</span>
            <span class="tf-count">${vReps.length}</span>
          </div>`;
        if (vOpen) {
          for (const r of vReps) {
            html += `<div class="tree-indent-2">
              <div class="tree-report" onclick="navigate('arch-view',{viewReport:${r.id}})">
                <span class="tr-icon">📄</span>
                <span class="tr-title">${r.title}</span>
                <span class="tr-year">${fmtDateShort(r.date)}</span>
              </div></div>`;
          }
        }
        html += `</div>`;
      }
      html += `</div>`;
    }
  }
  html += '</div>';
  return html;
}

function archToggleFolder(id) {
  if (S.archOpenFolders.has(id)) S.archOpenFolders.delete(id);
  else S.archOpenFolders.add(id);
  const el = document.getElementById('arch-results');
  if (el) el.innerHTML = buildArchResults();
}

// REPORT SUBMISSION

function buildReportNew() {
  if (S.rSubmitted) return buildSubmitSuccess();
  const steps = ['Kategorija','Vrsta','Vsebina','Pregled'];
  const st = S.rStep;
  const stepperHtml = steps.map((s,i)=>{
    const n=i+1, isDone=n<st, isAct=n===st;
    return `<div class="step${isDone?' done':''}${isAct?' active':''}">
      <div class="step-circle">${isDone?'✓':n}</div>
      <div class="step-label">${s}</div>
      ${n<steps.length?`<div class="step-line"></div>`:''}
    </div>`;
  }).join('');
  let body='';
  if(st===1) body=buildRStep1();
  else if(st===2) body=buildRStep2();
  else if(st===3) body=buildRStep3();
  else if(st===4) body=buildRStep4();
  return `
  <button class="back-link" onclick="navigate('dashboard')">← Nazaj</button>
  <div class="section-heading"><h1>Novo poročilo</h1><p>Sledite korakom za ustvarjanje in oddajo</p></div>
  <div class="stepper">${stepperHtml}</div>
  ${body}`;
}

function buildRStep1() {
  const cats = [
    { id:'dejavnost', icon:'🏕️', name:'Dejavnost', desc:'Zbori, taborjenje, izleti, prireditve…' },
    { id:'funkcija',  icon:'📋', name:'Funkcija',  desc:'Letno poročilo, načrt dela ali finančno poročilo po vlogi.' },
    { id:'vod',       icon:'👥', name:'Poročilo voda', desc:'Pregled napredka in dosežkov voda.' },
  ];
  return `<div class="sub-section">
    <h3>1. Izberite kategorijo</h3>
    <div class="type-grid">
      ${cats.map(c=>`
      <div class="type-card${S.rCat===c.id?' sel':''}" onclick="rSelectCat('${c.id}')">
        <span class="tc-icon">${c.icon}</span>
        <div class="tc-name">${c.name}</div>
        <div style="font-size:.74rem;color:var(--text-muted);margin-top:4px;font-style:italic">${c.desc}</div>
      </div>`).join('')}
    </div>
    <div style="display:flex;justify-content:flex-end;margin-top:18px">
      <button class="btn btn-primary btn-lg" ${!S.rCat?'disabled':''}onclick="rGoStep(2)">Naprej →</button>
    </div>
  </div>`;
}

function buildRStep2() {
  let inner = '';
  if (S.rCat === 'dejavnost') {
    inner = `
    <span class="slbl">Podvrsta dejavnosti</span>
    <div class="chips">
      ${ACTIVITY_SUBTYPES.map(s=>`
      <div class="chip${S.rSubtype===s?' sel':''}" onclick="rSelectSubtype('${s}')">${s}</div>`).join('')}
    </div>`;
  } else if (S.rCat === 'funkcija') {
    inner = `
    <span class="slbl">Vaša vloga</span>
    <div class="chips" style="margin-bottom:18px">
      ${FUNCTION_ROLES.map(r=>`
      <div class="chip${S.rRole===r?' sel':''}" onclick="rSelectRole('${r}')">${r}</div>`).join('')}
    </div>
    <span class="slbl">Vrsta poročila</span>
    <div class="chips">
      ${FUNC_TYPES.map(ft=>`
      <div class="chip${S.rFuncType===ft.id?' sel':''}" onclick="rSelectFuncType('${ft.id}')">${ft.icon} ${ft.name}</div>`).join('')}
    </div>`;
  } else if (S.rCat === 'vod') {
    inner = `<div style="background:var(--green-pale);border:1px solid var(--green-mid);border-radius:var(--r);padding:16px 18px;font-size:.88rem;color:var(--green-dark)">
      ✅ Predloga za poročilo voda bo samodejno izbrana. Kliknite <b>Naprej</b> za izpolnjevanje.
    </div>`;
  }
  const canNext = S.rCat==='vod' || (S.rCat==='dejavnost'&&S.rSubtype) || (S.rCat==='funkcija'&&S.rRole&&S.rFuncType);
  const tmpl = S.rCat==='vod' ? resolveTmpl('vod') : (canNext ? resolveTmpl(S.rCat, S.rRole, S.rFuncType) : null);
  return `<div class="sub-section">
    <h3>2. Specificiranje</h3>
    ${inner}
    ${tmpl&&canNext?`<div style="margin-top:16px;padding:10px 14px;background:var(--blue-pale);border:1px solid #A8C4E0;border-radius:var(--r);font-size:.82rem;color:var(--blue)">
      📋 Predloga: <b>${tmpl.name}</b>${!tmpl.general?` <span class="badge bb" style="margin-left:6px">Posamična</span>`:''}</div>`:''}
    <div style="display:flex;justify-content:space-between;margin-top:20px">
      <button class="btn btn-ghost" onclick="rGoStep(1)">← Nazaj</button>
      <button class="btn btn-primary btn-lg" ${!canNext?'disabled':''}onclick="rGoStep(3)">Naprej →</button>
    </div>
  </div>`;
}

function buildRStep3() {
  const tmpl = resolveTmpl(S.rCat, S.rRole, S.rFuncType);
  if (!tmpl) return `<div class="sub-section"><p style="color:var(--red-light)">Napaka: predloga ni najdena.</p></div>`;
  return `
  <div class="draft-toolbar">
    <div style="display:flex;align-items:center;gap:7px"><span class="as-dot"></span> Osnutek se samodejno shranjuje</div>
    <span id="save-lbl" style="font-size:.78rem;opacity:.7">Shranjeno ✓</span>
  </div>
  <div class="sub-section">
    <h3>3. Izpolnite vsebino</h3>
    <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px">
      ${S.rSubtype?`<span class="badge ba">${S.rSubtype}</span>`:''}
      ${S.rRole?`<span class="badge bb">${S.rRole}</span>`:''}
      ${S.rFuncType?`<span class="badge bb">${FUNC_TYPES.find(ft=>ft.id===S.rFuncType)?.name}</span>`:''}
      <span class="badge bgr">📋 ${tmpl.name}</span>
    </div>
    ${tmpl.fields.map(f=>`
    <div class="fg">
      <label>${f.name}</label>
      ${f.type==='Dolgo besedilo'
        ?`<textarea class="fc" rows="4" placeholder="Vnesite ${f.name.toLowerCase()}…" onchange="rSaveField('${f.id}',this.value)" oninput="rTriggerAutosave()">${S.rFields[f.id]||''}</textarea>`
        :f.type==='Število'
        ?`<input type="number" class="fc" placeholder="0" value="${S.rFields[f.id]||''}" onchange="rSaveField('${f.id}',this.value)">`
        :f.type==='Datum'
        ?`<input type="date" class="fc" value="${S.rFields[f.id]||''}" onchange="rSaveField('${f.id}',this.value)">`
        :`<input type="text" class="fc" placeholder="Vnesite ${f.name.toLowerCase()}…" value="${S.rFields[f.id]||''}" onchange="rSaveField('${f.id}',this.value)" oninput="rTriggerAutosave()">`
      }
    </div>`).join('')}
    <div style="display:flex;justify-content:space-between;margin-top:10px">
      <button class="btn btn-ghost" onclick="rGoStep(2)">← Nazaj</button>
      <div style="display:flex;gap:9px">
        <button class="btn btn-secondary" onclick="toast('💾 Osnutek shranjen.')">💾 Shrani osnutek</button>
        <button class="btn btn-primary btn-lg" onclick="rGoStep(4)">Pregled →</button>
      </div>
    </div>
  </div>`;
}

function buildRStep4() {
  const tmpl = resolveTmpl(S.rCat, S.rRole, S.rFuncType);
  return `<div class="sub-section">
    <h3>4. Pregled in oddaja</h3>
    <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px">
      ${S.rSubtype?`<span class="badge ba">${S.rSubtype}</span>`:''}
      ${S.rRole?`<span class="badge bb">${S.rRole}</span>`:''}
      ${S.rFuncType?`<span class="badge bb">${FUNC_TYPES.find(ft=>ft.id===S.rFuncType)?.name}</span>`:''}
    </div>
    ${tmpl?tmpl.fields.map(f=>`
    <div class="review-field">
      <label>${f.name}</label>
      <div class="rv">${S.rFields[f.id]||`<em style="color:var(--border)">— ni izpolnjeno —</em>`}</div>
    </div>`).join(''):''}
    <div style="background:var(--amber-pale);border:1px solid #D4C070;border-radius:var(--r);padding:11px 15px;margin-top:14px;font-size:.83rem;color:var(--amber)">
      ⚠️ Po oddaji poročila ga ne bo mogoče urejati. Preverite vsebino.
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:18px">
      <button class="btn btn-ghost" onclick="rGoStep(3)">← Nazaj na urejanje</button>
      <button class="btn btn-primary btn-lg" onclick="rSubmit()">✓ Oddaj poročilo</button>
    </div>
  </div>`;
}

function buildSubmitSuccess() {
  return `<div class="confirm-banner">
    <span class="cb-ico">🎉</span>
    <h3>Poročilo uspešno oddano!</h3>
    <p>Vaše poročilo je bilo arhivirano in je vidno v arhivu.</p>
    <div style="display:flex;justify-content:center;gap:10px;margin-top:20px">
      <button class="btn btn-primary" onclick="rReset();navigate('archive')">Pojdi na arhiv</button>
      <button class="btn btn-ghost" onclick="rReset();navigate('dashboard')">Na začetek</button>
    </div>
  </div>`;
}

function rSelectCat(c) { S.rCat=c; S.rSubtype=null; S.rRole=null; S.rFuncType=null;
  if(c==='vod') S.rTmplId='g-vod';
  setHTML('content',`<div class="page-wrap anim">${buildReportNew()}</div>`);
}
function rSelectSubtype(s) { S.rSubtype=s; setHTML('content',`<div class="page-wrap anim">${buildReportNew()}</div>`); }
function rSelectRole(r) { S.rRole=r; setHTML('content',`<div class="page-wrap anim">${buildReportNew()}</div>`); }
function rSelectFuncType(t) { S.rFuncType=t; setHTML('content',`<div class="page-wrap anim">${buildReportNew()}</div>`); }
function rGoStep(n) { S.rStep=n; setHTML('content',`<div class="page-wrap anim">${buildReportNew()}</div>`); }
function rSaveField(id,val) { S.rFields[id]=val; }
function rTriggerAutosave() {
  const el=document.getElementById('save-lbl'); if(el) el.textContent='Shranjuje…';
  clearTimeout(window._as);
  window._as=setTimeout(()=>{ const e=document.getElementById('save-lbl'); if(e) e.textContent='Shranjeno ✓'; },1200);
}
function rSubmit() { S.rSubmitted=true; setHTML('content',`<div class="page-wrap anim">${buildReportNew()}</div>`); }
function rReset() { S.rStep=1; S.rCat=null; S.rSubtype=null; S.rRole=null; S.rFuncType=null; S.rTmplId=null; S.rFields={}; S.rSubmitted=false; }
