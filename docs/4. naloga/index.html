    <div class="tmpl-card">
      <div class="tmpl-ico">${t.icon}</div>
      <div class="tmpl-info">
        <h3>${t.name}</h3>
        <p>${t.fields.length} polj · ${t.role} · ${FUNC_TYPES.find(ft=>ft.id===t.funcType)?.name}</p>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:5px">
          ${t.fields.slice(0,4).map(f=>`<span class="badge bgr">${f.name}</span>`).join('')}
          ${t.fields.length>4?`<span class="badge bgr">+${t.fields.length-4}</span>`:''}
        </div>
      </div>
      <div class="tmpl-actions">
        <button class="btn btn-secondary btn-sm" onclick="navigate('tmpl-edit',{editTmpl:JSON.parse(JSON.stringify(${JSON.stringify(t)}))})">✏️ Uredi</button>
        <button class="btn btn-danger btn-sm" onclick="deleteTmpl('${t.id}')">🗑</button>
      </div>
    </div>`).join('')}
    ${allRoleTemplates.length===0?`<div class="empty"><span class="ei">📋</span><p>Ni posamičnih predlog. Ustvarite prvo spodaj.</p></div>`:''}
    <div class="create-specific">
      <span style="font-size:1.6rem">➕</span>
      <div style="flex:1">
        <div style="font-weight:600;color:var(--blue);margin-bottom:4px">Ustvari novo posamično predlogo</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <select class="fc" id="new-role" style="width:auto">
            ${FUNCTION_ROLES.map(r=>`<option value="${r}">${r}</option>`).join('')}
          </select>
          <select class="fc" id="new-ftype" style="width:auto">
            ${FUNC_TYPES.map(ft=>`<option value="${ft.id}">${ft.name}</option>`).join('')}
          </select>
          <button class="btn btn-primary btn-sm" onclick="createRoleTmpl()">Ustvari</button>
        </div>
      </div>
    </div>
  </div>`;
}

function deleteTmpl(id) {
  if(confirm('Res želite izbrisati to predlogo?')) {
    allRoleTemplates = allRoleTemplates.filter(t=>t.id!==id);
    setHTML('content',`<div class="page-wrap anim">${buildTemplates()}</div>`);
    toast('🗑️ Predloga izbrisana.');
  }
}

function createRoleTmpl() {
  const role = document.getElementById('new-role').value;
  const funcType = document.getElementById('new-ftype').value;
  const existing = allRoleTemplates.find(t=>t.role===role&&t.funcType===funcType);
  if(existing) { toast('Ta kombinacija že obstaja. Uredite obstoječo predlogo.','amb'); return; }
  const baseTmpl = GENERAL_TEMPLATES.find(t=>t.funcType===funcType);
  const ftObj = FUNC_TYPES.find(ft=>ft.id===funcType);
  const newT = {
    id: `r-${role.replace(/\s/g,'-').toLowerCase()}-${funcType}-${Date.now()}`,
    name: `${ftObj?.name||funcType} – ${role}`,
    cat:'funkcija', funcType, role,
    icon: ftObj?.icon||'📋', general:false,
    fields: baseTmpl ? baseTmpl.fields.map(f=>({...f})) : [],
  };
  allRoleTemplates.push(newT);
  navigate('tmpl-edit', { editTmpl: JSON.parse(JSON.stringify(newT)) });
}

function buildTmplEditor() {
  const t = S.editTmpl;
  if(!t) return `<button class="back-link" onclick="navigate('templates')">← Nazaj</button><p>Napaka.</p>`;
  const icons = ['📄','🏕️','📋','📅','👥','💰','🌲','🏆','📊','📎','🎯','📌'];
  return `
  <button class="back-link" onclick="navigate('templates')">← Nazaj na predloge</button>
  <div class="section-heading">
    <h1>${t.general?'Uredi splošno predlogo':'Uredi predlogo'}</h1>
    <p>${t.name}${t.role?` · ${t.role}`:''}</p>
  </div>
  <div style="background:var(--cream);border:1px solid var(--border-light);border-radius:var(--rl);padding:26px 28px;box-shadow:var(--shadow-sm)">
    <div class="fg"><label>Naziv predloge</label>
      <input class="fc" id="te-name" value="${t.name}" placeholder="Naziv predloge"></div>
    <div class="fg"><label>Ikona</label>
      <div class="icon-picker" id="te-icons">
        ${icons.map(ic=>`<div class="ip-opt${t.icon===ic?' sel':''}" onclick="tSelIcon('${ic}')">${ic}</div>`).join('')}
      </div>
    </div>
    ${t.role?`<div style="display:flex;gap:7px;margin-bottom:18px">
      <span class="badge bb">👤 ${t.role}</span>
      <span class="badge bb">${FUNC_TYPES.find(ft=>ft.id===t.funcType)?.name||t.funcType}</span>
    </div>`:''}
    <hr class="div">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <h3 style="font-family:'Playfair Display',serif;font-size:1rem;color:var(--green-dark)">Polja predloge</h3>
    </div>
    <div class="field-list" id="te-fields">
      ${(t.fields||[]).map(f=>`
      <div class="field-item">
        <span class="fi-drag">⠿</span>
        <span class="fi-name">${f.name}</span>
        <span class="fi-type">${f.type}</span>
        <button class="btn btn-danger btn-sm btn-icon" onclick="teRemoveField('${f.id}')">✕</button>
      </div>`).join('')}
    </div>
    <div style="display:flex;gap:9px;align-items:flex-end;margin-bottom:18px;flex-wrap:wrap">
      <div class="fg" style="flex:2;margin:0"><label>Novo polje</label>
        <input class="fc" id="te-fn" placeholder="Naziv polja"></div>
      <div class="fg" style="flex:1;margin:0"><label>Tip</label>
        <select class="fc" id="te-ft">
          <option>Besedilo</option><option>Dolgo besedilo</option><option>Število</option><option>Datum</option>
        </select>
      </div>
      <button class="btn btn-secondary" onclick="teAddField()">+ Dodaj</button>
    </div>
    <div style="display:flex;justify-content:space-between">
      <button class="btn btn-ghost" onclick="navigate('templates')">Prekliči</button>
      <button class="btn btn-primary btn-lg" onclick="teSave()">💾 Shrani predlogo</button>
    </div>
  </div>`;
}

function tSelIcon(ic) {
  S.editTmpl.icon=ic;
  document.querySelectorAll('.ip-opt').forEach(el=>el.classList.remove('sel'));
  event.target.classList.add('sel');
}
function teRemoveField(fid) {
  S.editTmpl.fields = S.editTmpl.fields.filter(f=>f.id!==fid);
  setHTML('content',`<div class="page-wrap anim">${buildTmplEditor()}</div>`);
}
function teAddField() {
  const name = document.getElementById('te-fn').value.trim();
  const type = document.getElementById('te-ft').value;
  if(!name) return;
  S.editTmpl.fields.push({id:'f'+Date.now(), name, type});
  setHTML('content',`<div class="page-wrap anim">${buildTmplEditor()}</div>`);
}
function teSave() {
  const name = document.getElementById('te-name').value.trim();
  if(!name) { toast('Vnesite naziv predloge.','err'); return; }
  S.editTmpl.name = name;
  // update in appropriate list
  if (S.editTmpl.general) {
    const idx = GENERAL_TEMPLATES.findIndex(t=>t.id===S.editTmpl.id);
    if(idx>=0) Object.assign(GENERAL_TEMPLATES[idx], S.editTmpl);
  } else {
    const idx = allRoleTemplates.findIndex(t=>t.id===S.editTmpl.id);
    if(idx>=0) Object.assign(allRoleTemplates[idx], S.editTmpl);
    else allRoleTemplates.push(S.editTmpl);
  }
  toast('✅ Predloga shranjena.');
  navigate('templates');
}

// ═══════════════════════════════════════════════
// GROUP PAGE
// ═══════════════════════════════════════════════
function buildGroupPage() {
  const allPraise = MEMBERS.reduce((a,m)=>a+m.praise.length,0);
  const allScold  = MEMBERS.reduce((a,m)=>a+m.scold.length,0);
  const avgAtt    = Math.round(MEMBERS.reduce((s,m)=>s+attPct(m),0)/MEMBERS.length);
  const bdaySoon  = MEMBERS.filter(m=>isBdaySoon(m.bday)).length;
  const totalEarned = MEMBERS.reduce((s,m)=>s+SKILLS.filter(sk=>skillEarned(m,sk.id)).length,0);

  return `
  <button class="back-link" onclick="navigate('dashboard')">← Nazaj</button>
  <div class="section-heading">
    <h1>${S.user.group}</h1>
    <p>Upravljanje prisotnosti, veščin in pohval</p>
  </div>
  <div class="group-stats">
    <div class="stat-card"><div class="sc-num">${MEMBERS.length}</div><div class="sc-lbl">Članov skupaj</div></div>
    <div class="stat-card"><div class="sc-num">${avgAtt}%</div><div class="sc-lbl">Povprečna prisotnost</div></div>
    <div class="stat-card"><div class="sc-num" style="color:var(--amber)">${bdaySoon}</div><div class="sc-lbl">Bližnji rojstni dnevi 🎂</div></div>
    <div class="stat-card"><div class="sc-num" style="color:var(--green)">${allPraise}</div><div class="sc-lbl">Pohval skupaj 👍</div></div>
    <div class="stat-card"><div class="sc-num" style="color:var(--red-light)">${allScold}</div><div class="sc-lbl">Graje skupaj 👎</div></div>
    <div class="stat-card"><div class="sc-num">${totalEarned}</div><div class="sc-lbl">Pridobljenih veščin</div></div>
  </div>
  <div style="display:flex;justify-content:flex-end;margin-bottom:16px">
    <button class="btn btn-secondary" onclick="grpExportReport()">📤 Izvozi v poročilo voda</button>
  </div>
  <div class="tabs">
    <div class="tab${S.groupTab==='prisotnost'?' active':''}" onclick="grpTab('prisotnost')">📅 Prisotnost</div>
    <div class="tab${S.groupTab==='vescine'?' active':''}" onclick="grpTab('vescine')">⭐ Veščine</div>
    <div class="tab${S.groupTab==='pohvale'?' active':''}" onclick="grpTab('pohvale')">📋 Pohvale in graje</div>
    <div class="tab${S.groupTab==='upravljanje'?' active':''}" onclick="grpTab('upravljanje')">👤 Upravljanje voda</div>
  </div>
  <div id="group-tab-content" class="anim">${buildGroupTabContent()}</div>`;
}

function grpTab(tab) {
  S.groupTab = tab;
  if(tab !== 'vescine') S.selSkill = null;
  // update tab nav active state
  document.querySelectorAll('.tab').forEach(el=>{
    el.classList.toggle('active', el.textContent.trim().includes({prisotnost:'Prisotnost',vescine:'Veščine',pohvale:'Pohvale',upravljanje:'Upravljanje'}[tab]||'__'));
  });
  updateGroupTab();
}

function buildGroupTabContent() {
  switch(S.groupTab) {
    case 'prisotnost': return buildTabPrisotnost();
    case 'vescine':    return buildTabVescine();
    case 'pohvale':    return buildTabPohvale();
    case 'upravljanje':return buildTabUpravljanje();
    default: return '';
  }
}

// ─── TAB: PRISOTNOST ───
function buildTabPrisotnost() {
  const memberHeader = `<th class="col-member">Tabornik</th>`;
  const meetingHeaders = MEETINGS.map(m=>`
    <th title="${fmtDate(m.date)}" style="min-width:52px;max-width:64px">
      <div style="font-size:.7rem">${fmtDateShort(m.date)}</div>
      <div style="font-size:.65rem;opacity:.75;font-weight:400">${m.label.length>8?m.label.slice(0,8)+'…':m.label}</div>
    </th>`).join('');
  const pctHeader = `<th style="min-width:50px">%</th>`;

  const rows = MEMBERS.map(m=>{
    const cells = MEETINGS.map(mt=>{
      const v = m.att[mt.id];
      const cls = v===true?'present':v===false?'absent':'unknown';
      const sym = v===true?'✓':v===false?'✕':'·';
      return `<td><div class="att-cell ${cls}" id="att-${m.id}-${mt.id}" onclick="grpToggleAtt(${m.id},'${mt.id}')">${sym}</div></td>`;
    }).join('');
    const pct = attPct(m);
    const color = pct>=80?'var(--green)':pct>=50?'var(--amber-light)':'var(--red-light)';
    return `<tr>
      <td class="col-member">${m.name}</td>
      ${cells}
      <td><span style="font-size:.78rem;font-weight:700;color:${color}">${pct}%</span></td>
    </tr>`;
  }).join('');

  // attendance summary row
  const summaryRow = `<tr style="background:var(--parchment)">
    <td class="col-member" style="font-size:.75rem;color:var(--text-muted);font-style:italic">Prisotnih</td>
    ${MEETINGS.map(mt=>{
      const cnt = MEMBERS.filter(m=>m.att[mt.id]===true).length;
      return `<td style="font-size:.75rem;font-weight:600;color:var(--text-muted)">${cnt}/${MEMBERS.length}</td>`;
    }).join('')}
    <td></td>
  </tr>`;

  return `
  <div class="inh">
    <h2>Evidenca prisotnosti</h2>
    <div style="display:flex;gap:8px">
      <button class="btn btn-secondary btn-sm" onclick="grpMarkToday()">📅 Označi današnjo prisotnost</button>
      <button class="btn btn-primary btn-sm" onclick="grpAddMeeting()">+ Dodaj srečanje</button>
    </div>
  </div>
  <div style="font-size:.78rem;color:var(--text-muted);margin-bottom:12px;display:flex;gap:14px;flex-wrap:wrap">
    <span style="display:flex;align-items:center;gap:5px"><span class="att-cell present" style="width:20px;height:20px;font-size:.72rem">✓</span> Prisoten/na</span>
    <span style="display:flex;align-items:center;gap:5px"><span class="att-cell absent" style="width:20px;height:20px;font-size:.72rem">✕</span> Odsoten/na</span>
    <span style="display:flex;align-items:center;gap:5px"><span class="att-cell unknown" style="width:20px;height:20px;font-size:.72rem">·</span> Neznano</span>
    <span style="margin-left:auto;font-style:italic">Kliknite celico za preklop stanja</span>
  </div>
  <div class="matrix-wrap">
    <table class="matrix-table">
      <thead><tr>${memberHeader}${meetingHeaders}${pctHeader}</tr></thead>
      <tbody>${rows}${summaryRow}</tbody>
    </table>
  </div>`;
}

function grpToggleAtt(memberId, meetingId) {
  const m = MEMBERS.find(x=>x.id===memberId); if(!m) return;
  const cur = m.att[meetingId];
  const next = cur===null||cur===undefined ? true : cur===true ? false : null;
  m.att[meetingId] = next;
  const cell = document.getElementById(`att-${memberId}-${meetingId}`);
  if(cell) {
    cell.className = 'att-cell '+(next===true?'present':next===false?'absent':'unknown');
    cell.textContent = next===true?'✓':next===false?'✕':'·';
  }
  // update pct cell in same row
  const pct = attPct(m);
  const color = pct>=80?'var(--green)':pct>=50?'var(--amber-light)':'var(--red-light)';
  const allCells = document.querySelectorAll(`#att-${memberId}-${meetingId}`);
  // update summary row
  const summaryTds = document.querySelectorAll('.matrix-table tbody tr:last-child td');
  MEETINGS.forEach((mt,i) => {
    const cnt = MEMBERS.filter(x=>x.att[mt.id]===true).length;
    if(summaryTds[i+1]) summaryTds[i+1].textContent = `${cnt}/${MEMBERS.length}`;
  });
}

function grpMarkToday() {
  const today = new Date().toISOString().split('T')[0];
  const existing = MEETINGS.find(m=>m.date===today);
  if (existing) {
    showModal(`
    <h2>📅 Označi prisotnost</h2>
    <p style="color:var(--text-muted);font-style:italic;margin-bottom:16px">Srečanje: <b>${existing.label}</b> (${fmtDate(today)})</p>
    <div class="member-mgmt-list" style="max-height:320px;overflow-y:auto">
      ${MEMBERS.map(m=>{
        const v=m.att[existing.id];
        return `<div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border-light)">
          <div class="mbr-avatar">${initials(m.name)}</div>
          <span style="flex:1;font-size:.9rem;font-weight:600">${m.name}</span>
          <button class="btn btn-sm ${v===true?'btn-primary':'btn-ghost'}" onclick="grpSetAtt(${m.id},'${existing.id}',true,this)">${v===true?'✓ Prisoten/na':'Prisoten/na'}</button>
          <button class="btn btn-sm ${v===false?'btn-danger':'btn-ghost'}" onclick="grpSetAtt(${m.id},'${existing.id}',false,this)">${v===false?'✕ Odsoten/na':'Odsoten/na'}</button>
        </div>`;
      }).join('')}
    </div>
    <div class="mo-actions"><button class="btn btn-primary" onclick="closeModal();updateGroupTab()">Shrani in zapri</button></div>`);
  } else {
    const label = prompt('Naziv današnjega srečanja:','Srečanje');
    if(!label) return;
    const newId = 'm'+Date.now();
    MEETINGS.push({id:newId, date:today, label});
    MEMBERS.forEach(m=>{ m.att[newId]=null; });
    toast('✅ Srečanje dodano. Označite prisotnost v tabeli.');
    updateGroupTab();
  }
}

function grpSetAtt(memberId, meetingId, val, btn) {
  const m = MEMBERS.find(x=>x.id===memberId); if(!m) return;
  m.att[meetingId] = m.att[meetingId]===val ? null : val;
}

function grpAddMeeting() {
  showModal(`
  <h2>📅 Dodaj srečanje</h2>
  <div class="fg"><label>Datum</label><input type="date" class="fc" id="nm-date" value="${new Date().toISOString().split('T')[0]}"></div>
  <div class="fg"><label>Naziv</label><input type="text" class="fc" id="nm-label" placeholder="npr. Srečanje #13, Izlet…"></div>
  <div class="mo-actions">
    <button class="btn btn-ghost" onclick="closeModal()">Prekliči</button>
    <button class="btn btn-primary" onclick="grpDoAddMeeting()">Dodaj</button>
  </div>`);
}
function grpDoAddMeeting() {
  const date=document.getElementById('nm-date').value, label=document.getElementById('nm-label').value.trim();
  if(!date||!label){toast('Izpolnite datum in naziv.','err');return;}
  const newId='m'+Date.now();
  MEETINGS.push({id:newId,date,label});
  MEMBERS.forEach(m=>{m.att[newId]=null;});
  closeModal(); updateGroupTab(); toast('✅ Srečanje dodano.');
}

// ─── TAB: VEŠČINE ───
function buildTabVescine() {
  if (S.selSkill) return buildSkillMatrix(S.selSkill);
  return buildSkillGrid();
}

function buildSkillGrid() {
  return `
  <div class="inh"><h2>Pregled veščin</h2><span style="font-size:.82rem;color:var(--text-muted);font-style:italic">Kliknite veščino za upravljanje zahtev po članih</span></div>
  <div class="skill-grid">
    ${SKILLS.map(sk=>{
      const earned = MEMBERS.filter(m=>skillEarned(m,sk.id)).length;
      const avgP = Math.round(MEMBERS.reduce((s,m)=>s+skillPct(m,sk.id),0)/MEMBERS.length);
      return `
      <div class="skill-card" onclick="grpSelSkill('${sk.id}')">
        <span class="sk-icon">${sk.icon}</span>
        <div class="sk-name">${sk.name}</div>
        <div class="sk-prog">${earned}/${MEMBERS.length} pridobilo · ${sk.reqs.length} zahtev</div>
        <div class="skill-pbar"><div class="skill-pbar-fill" style="width:${avgP}%"></div></div>
      </div>`;
    }).join('')}
  </div>`;
}

function buildSkillMatrix(skillId) {
  const sk = SKILLS.find(s=>s.id===skillId); if(!sk) return buildSkillGrid();
  const earned = MEMBERS.filter(m=>skillEarned(m,sk.id)).length;
  const reqHeaders = sk.reqs.map(r=>`<th title="${r.text}" style="min-width:42px;max-width:56px;font-size:.68rem;line-height:1.25">${r.text.length>22?r.text.slice(0,22)+'…':r.text}</th>`).join('');
  const rows = MEMBERS.map(m=>{
    const cells = sk.reqs.map(r=>{
      const done = (m.skills[skillId]||{})[r.id]===true;
      return `<td><div class="req-cell ${done?'done':'todo'}" id="req-${m.id}-${skillId}-${r.id}" onclick="grpToggleReq(${m.id},'${skillId}','${r.id}')">${done?'✓':'·'}</div></td>`;
    }).join('');
    const isEarned = skillEarned(m,skillId);
    const pct = skillPct(m,skillId);
    return `<tr>
      <td class="col-member">${m.name}</td>
      ${cells}
      <td><span class="earned-cell ${isEarned?'yes':'no'}">${isEarned?'✓ Pridobljena':`${Math.round(pct/100*sk.reqs.length)}/${sk.reqs.length}`}</span></td>
    </tr>`;
  }).join('');
  return `
  <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap">
    <button class="back-link" style="margin:0" onclick="grpSelSkill(null)">← Vse veščine</button>
    <span style="font-size:1.4rem">${sk.icon}</span>
    <div>
      <div style="font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:700;color:var(--green-dark)">${sk.name}</div>
      <div style="font-size:.78rem;color:var(--text-muted)">${earned}/${MEMBERS.length} članov jo je pridobilo · ${sk.reqs.length} zahtev</div>
    </div>
  </div>
  <div style="font-size:.78rem;color:var(--text-muted);margin-bottom:10px;display:flex;gap:14px;flex-wrap:wrap">
    <span><span class="req-cell done" style="width:18px;height:17px;font-size:.7rem;display:inline-flex">✓</span> Opravljeno</span>
    <span><span class="req-cell todo" style="width:18px;height:17px;font-size:.7rem;display:inline-flex">·</span> Ni opravljeno</span>
    <span style="margin-left:auto;font-style:italic">Kliknite celico za preklop</span>
  </div>
  <div class="req-table-wrap">
    <table class="req-table">
      <thead><tr><th class="col-member">Tabornik</th>${reqHeaders}<th style="min-width:110px">Status</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function grpSelSkill(id) { S.selSkill=id; updateGroupTab(); }

function grpToggleReq(memberId, skillId, reqId) {
  const m = MEMBERS.find(x=>x.id===memberId); if(!m) return;
  if(!m.skills[skillId]) m.skills[skillId]={};
  m.skills[skillId][reqId] = !m.skills[skillId][reqId];
  const cell = document.getElementById(`req-${memberId}-${skillId}-${reqId}`);
  const done = m.skills[skillId][reqId];
  if(cell) { cell.className='req-cell '+(done?'done':'todo'); cell.textContent=done?'✓':'·'; }
  // update earned cell in same row
  const isEarned = skillEarned(m,skillId);
  const sk = SKILLS.find(s=>s.id===skillId);
  const pct = skillPct(m,skillId);
  // find row's earned cell (last td)
  if(cell) {
    const row = cell.closest('tr');
    if(row) {
      const lastTd = row.querySelector('td:last-child .earned-cell');
      if(lastTd) {
        lastTd.className='earned-cell '+(isEarned?'yes':'no');
        lastTd.textContent=isEarned?'✓ Pridobljena':`${Math.round(pct/100*sk.reqs.length)}/${sk.reqs.length}`;
      }
    }
  }
  if(isEarned) toast(`✅ ${m.name} je pridobil/a veščino ${sk.name}!`);
}

// ─── TAB: POHVALE & GRAJE ───
function buildTabPohvale() {
  const pf = S.praiseFilter;
  let entries = [];
  MEMBERS.forEach(m=>{
    m.praise.forEach(p=>entries.push({...p, type:'praise', who:m.name, memberId:m.id}));
    m.scold.forEach(s=>entries.push({...s, type:'scold', who:s.who||m.name, memberId:m.id}));
  });
  entries.sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(pf==='praise') entries=entries.filter(e=>e.type==='praise');
  if(pf==='scold')  entries=entries.filter(e=>e.type==='scold');

  return `
  <div class="inh">
    <h2>Pohvale in graje</h2>
    <div style="display:flex;gap:8px">
      <button class="btn btn-secondary btn-sm" onclick="grpAddLog('praise')">👍 Dodaj pohvalo</button>
      <button class="btn btn-danger btn-sm" onclick="grpAddLog('scold')">👎 Dodaj grajo</button>
    </div>
  </div>
  <div class="filter-row">
    <button class="fr-btn${pf==='all'?' active':''}" onclick="grpPraiseFilter('all')">Vse (${MEMBERS.reduce((s,m)=>s+m.praise.length+m.scold.length,0)})</button>
    <button class="fr-btn${pf==='praise'?' active':''}" onclick="grpPraiseFilter('praise')">👍 Pohvale (${MEMBERS.reduce((s,m)=>s+m.praise.length,0)})</button>
    <button class="fr-btn${pf==='scold'?' active':''}" onclick="grpPraiseFilter('scold')">👎 Graje (${MEMBERS.reduce((s,m)=>s+m.scold.length,0)})</button>
  </div>
  ${entries.length===0?`<div class="empty"><span class="ei">📋</span><p>Ni vnosov za ta filter.</p></div>`:`
  <div class="log-list">
    ${entries.map(e=>`
    <div class="log-item ${e.type}">
      <span style="font-size:1.1rem">${e.type==='praise'?'👍':'👎'}</span>
      <div style="flex:1">
        <div class="li-who">${e.who}</div>
        <div class="li-text">${e.text}</div>
      </div>
      <span class="li-date">${fmtDate(e.date)}</span>
    </div>`).join('')}
  </div>`}`;
}

function grpPraiseFilter(f) { S.praiseFilter=f; updateGroupTab(); }

function grpAddLog(type) {
  showModal(`
  <h2>${type==='praise'?'👍 Dodaj pohvalo':'👎 Dodaj grajo'}</h2>
  <div class="fg"><label>Tabornik</label>
    <select class="fc" id="al-who">
      ${MEMBERS.map(m=>`<option value="${m.id}">${m.name}</option>`).join('')}
    </select>
  </div>
  <div class="fg"><label>Vsebina</label>
    <textarea class="fc" id="al-text" rows="3" placeholder="${type==='praise'?'Razlog za pohvalo…':'Razlog za grajo…'}"></textarea>
  </div>
  <div class="mo-actions">
    <button class="btn btn-ghost" onclick="closeModal()">Prekliči</button>
    <button class="btn btn-primary" onclick="grpDoAddLog('${type}')">Shrani</button>
  </div>`);
}
function grpDoAddLog(type) {
  const mid=parseInt(document.getElementById('al-who').value);
  const text=document.getElementById('al-text').value.trim();
  if(!text){toast('Vnesite vsebino.','err');return;}
  const m=MEMBERS.find(x=>x.id===mid); if(!m) return;
  const entry={text, date:new Date().toISOString().split('T')[0]};
  if(type==='praise') m.praise.push(entry); else m.scold.push(entry);
  closeModal(); updateGroupTab(); toast(type==='praise'?'👍 Pohvala zabeležena.':'👎 Graja zabeležena.');
}

// ─── TAB: UPRAVLJANJE VODA ───
function buildTabUpravljanje() {
  const q = (S.groupSearch||'').toLowerCase();
  const mems = MEMBERS.filter(m=>!q||m.name.toLowerCase().includes(q));
  return `
  <div class="inh">
    <h2>Upravljanje voda</h2>
    <button class="btn btn-primary btn-sm" onclick="grpAddMember()">+ Dodaj člana</button>
  </div>
  <div style="display:flex;gap:10px;margin-bottom:16px">
    <input class="fc" style="max-width:260px" type="text" placeholder="🔍 Iskanje…" value="${S.groupSearch||''}"
      oninput="S.groupSearch=this.value;updateGroupTab()">
  </div>
  <div class="member-mgmt-list">
    ${mems.map(m=>{
      const bd=isBdaySoon(m.bday), pct=attPct(m), earned=SKILLS.filter(sk=>skillEarned(m,sk.id)).length;
      return `
      <div class="mbr-row${bd?' bday':''}">
        <div class="mbr-avatar">${initials(m.name)}</div>
        <div style="flex:1;min-width:0">
          <div class="mbr-name">${m.name} ${bd?'🎂':''}</div>
          <div class="mbr-sub">Roj. ${fmtDate(m.bday)} · ${getAge(m.bday)} let · Prisotnost: ${pct}% · Veščine: ${earned}/${SKILLS.length}</div>
          <div style="margin-top:5px">
            <div class="pbar-wrap"><div class="pbar-fill" style="width:${pct}%;background:${pct>=80?'var(--green)':pct>=50?'var(--amber-light)':'var(--red-light)'}"></div></div>
          </div>
          ${m.notes?`<div style="font-size:.74rem;color:var(--text-muted);font-style:italic;margin-top:4px">${m.notes}</div>`:''}
        </div>
        <div class="mbr-actions">
          <button class="btn btn-ghost btn-sm" onclick="grpEditMember(${m.id})">✏️ Uredi</button>
          <button class="btn btn-danger btn-sm" onclick="grpDelMember(${m.id})">🗑</button>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

function grpAddMember() {
  showModal(`
  <h2>+ Dodaj člana</h2>
  <div class="fg"><label>Ime in priimek</label><input class="fc" id="am-name" placeholder="Npr. Anja Potočnik"></div>
  <div class="fg"><label>Datum rojstva</label><input type="date" class="fc" id="am-bday"></div>
  <div class="fg"><label>Opombe (neobvezno)</label><input class="fc" id="am-notes" placeholder="Kratka opomba…"></div>
  <div class="mo-actions">
    <button class="btn btn-ghost" onclick="closeModal()">Prekliči</button>
    <button class="btn btn-primary" onclick="grpDoAddMember()">Dodaj</button>
  </div>`);
}
function grpDoAddMember() {
  const name=document.getElementById('am-name').value.trim();
  const bday=document.getElementById('am-bday').value;
  const notes=document.getElementById('am-notes').value.trim();
  if(!name||!bday){toast('Vnesite ime in datum.','err');return;}
  const newId=Math.max(...MEMBERS.map(m=>m.id))+1;
  const attObj={};
  MEETINGS.forEach(mt=>{attObj[mt.id]=null;});
  MEMBERS.push({id:newId,name,bday,notes,att:attObj,skills:{},praise:[],scold:[]});
  closeModal(); updateGroupTab(); toast(`✅ Član "${name}" dodan.`);
}
function grpEditMember(id) {
  const m=MEMBERS.find(x=>x.id===id); if(!m) return;
  showModal(`
  <h2>✏️ Uredi člana</h2>
  <div class="fg"><label>Ime in priimek</label><input class="fc" id="em-name" value="${m.name}"></div>
  <div class="fg"><label>Datum rojstva</label><input type="date" class="fc" id="em-bday" value="${m.bday}"></div>
  <div class="fg"><label>Opombe</label><textarea class="fc" rows="2" id="em-notes">${m.notes||''}</textarea></div>
  <div class="mo-actions">
    <button class="btn btn-ghost" onclick="closeModal()">Prekliči</button>
    <button class="btn btn-primary" onclick="grpDoEditMember(${id})">Shrani</button>
  </div>`);
}
function grpDoEditMember(id) {
  const m=MEMBERS.find(x=>x.id===id); if(!m) return;
  const name=document.getElementById('em-name').value.trim();
  const bday=document.getElementById('em-bday').value;
  if(!name||!bday){toast('Vnesite ime in datum.','err');return;}
  m.name=name; m.bday=bday; m.notes=document.getElementById('em-notes').value.trim();
  closeModal(); updateGroupTab(); toast('✅ Podatki shranjeni.');
}
function grpDelMember(id) {
  const m=MEMBERS.find(x=>x.id===id); if(!m) return;
  if(confirm(`Res želite odstraniti "${m.name}" iz voda?`)) {
    MEMBERS=MEMBERS.filter(x=>x.id!==id);
    updateGroupTab(); toast(`🗑️ Član "${m.name}" odstranjen.`);
  }
}

function grpExportReport() {
  toast('📤 Pripravlja se osnutek poročila voda…','amb');
  setTimeout(()=>{
    rReset();
    S.rCat='vod'; S.rStep=3;
    S.rFields={
      f1: S.user.group,
      f2: S.user.name,
      f3: String(MEMBERS.length),
      f4: `${MEMBERS.filter(m=>SKILLS.filter(sk=>skillEarned(m,sk.id)).length>0).length} članov je pridobilo vsaj eno veščino v tekočem letu.`,
      f5: `Povprečna prisotnost voda: ${Math.round(MEMBERS.reduce((s,m)=>s+attPct(m),0)/MEMBERS.length)}%. Skupaj srečanj: ${MEETINGS.length}.`,
      f6: '',
    };
    navigate('report-new');
    toast('✅ Podatki uvoženi v osnutek poročila.');
  },1400);
}

// ═══════════════════════════════════════════════
// MODAL
// ═══════════════════════════════════════════════
function showModal(html) {
  const layer = document.getElementById('modal-layer');
  layer.innerHTML = `<div class="mo" onclick="if(event.target===this)closeModal()"><div class="mo-box">${html}</div></div>`;
}
function closeModal() { document.getElementById('modal-layer').innerHTML=''; }

// ═══════════════════════════════════════════════
// KEYBOARD
// ═══════════════════════════════════════════════
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && S.page==='login') doLogin();
  if(e.key==='Escape') closeModal();
});

// ═══════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════
renderPage();
</script>
</body>
